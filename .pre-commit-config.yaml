# Install once: `pre-commit install`. Gitleaks also runs in CI (ADR-021).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^(backend|parser)/
      - id: ruff-format
        files: ^(backend|parser)/
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
