# Alembic config. The DB URL comes from settings (APP_MIGRATOR_DATABASE_URL, role
# app_migrator), never from this file. Run from backend/: `uv run alembic upgrade head`.
#
# One revision per story, named <epic>_<story>_<slug>, e.g.:
#   uv run alembic revision --rev-id 2_1_users_sessions -m "users sessions"
# and rename the file to migrations/versions/2_1_users_sessions.py.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
file_template = %%(rev)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
