# Parser service (Story 9.2; ADR-027, NFR-025). Included by compose.yml.
#
# Untrusted files are parsed here, never in the api or worker. The container is on the
# internal `parsing` network only (no route out, no DB, no app secrets), runs read-only
# as a non-root user, and each parse runs in a child process under rlimits
# (CPU 120 s, address space 3 GB). Docling's layout/TableFormer models come read-only
# are staged with deploy/models/stage-models.sh and mounted read-only under /models/docling.
#
# Only the worker (on `parsing` too) calls it: POST http://parser:8080/parse.

services:
  parser:
    image: invest-ai-llm/parser:${APP_VERSION:-dev}
    build:
      context: ../parser
    pull_policy: never
    init: true  # reaps the sandboxed children
    restart: unless-stopped
    networks: [parsing]
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "10001:10001"
    mem_limit: 4g
    memswap_limit: 4g
    pids_limit: 128
    environment:
      DOCLING_ARTIFACTS_PATH: /models/docling
      PARSER_CONCURRENCY: "2"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OMP_NUM_THREADS: "4"
    volumes:
      # Staged by deploy/models/stage-models.sh under the names Docling expects.
      - ${APP_DATA_DIR:-/data}/models/docling-project--docling-layout-heron:/models/docling/docling-project--docling-layout-heron:ro
      - ${APP_DATA_DIR:-/data}/models/docling-project--docling-models:/models/docling/docling-project--docling-models:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      # The forkserver imports Docling before the service listens.
      start_period: 60s
    logging:
      driver: local
      options:
        max-size: 20m
        max-file: "5"
