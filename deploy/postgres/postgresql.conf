# invest-ai-llm PostgreSQL 18 config (Story 1.3). Mounted read-only and selected with
# `-c config_file=/etc/postgresql/postgresql.conf`.

listen_addresses = '*'                  # reachable only on the internal `app` network
port = 5432
max_connections = 100
hba_file = '/etc/postgresql/pg_hba.conf'
password_encryption = scram-sha-256

shared_buffers = 4GB
effective_cache_size = 16GB
work_mem = 32MB
maintenance_work_mem = 1GB
shared_preload_libraries = ''

# --- WAL: minimal retention, no archiving (ADR-035) --------------------------
# Bounds how long deleted ciphertext lingers in WAL segments.
wal_level = replica                     # keeps pg_basebackup possible (Story 7.5)
archive_mode = off
wal_keep_size = 0
max_wal_size = 1GB
min_wal_size = 80MB
max_wal_senders = 2
max_replication_slots = 0

# --- Logging: content-free (ADR-033) -----------------------------------------
# Statements, bind parameters and DETAIL lines (e.g. "Key (x)=(value)") can contain
# document content, so they are never logged.
log_destination = 'stderr'
logging_collector = off
log_statement = 'none'
log_min_duration_statement = -1
log_min_error_statement = panic
log_error_verbosity = terse
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
log_connections = 'authentication'
log_disconnections = off
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'

timezone = 'UTC'
datestyle = 'iso, mdy'
lc_messages = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'
