term_sheet_diff:
- id: TS-D01
  change: changed
  clause: Transaction
  v3: Acquisition by the Investor of a 26% stake in the Company by way of a secondary purchase.
  v4: Acquisition by the Investor of a 31% stake in the Company by way of a secondary purchase.
- id: TS-D02
  change: changed
  clause: Enterprise value
  v3: The enterprise value of the Company is agreed at ₹1,450 crore on a cash-free, debt-free basis.
  v4: The enterprise value of the Company is agreed at ₹1,520 crore on a cash-free, debt-free basis.
- id: TS-D03
  change: changed
  clause: Price per share
  v3: The purchase price shall be ₹412.50 per equity share.
  v4: The purchase price shall be ₹431.00 per equity share.
- id: TS-D04
  change: changed
  clause: Escrow
  v3: 10% of the consideration shall be held in escrow for 18 months from completion.
  v4: 12% of the consideration shall be held in escrow for 24 months from completion.
- id: TS-D05
  change: changed
  clause: Board
  v3: The Investor shall be entitled to nominate 1 director to the board.
  v4: The Investor shall be entitled to nominate 2 directors to the board.
- id: TS-D06
  change: changed
  clause: Conditions precedent
  v3: Completion is subject to satisfactory due diligence and shareholder approvals.
  v4: Completion is subject to satisfactory due diligence, shareholder approvals and approval of the Competition Commission
    of India.
- id: TS-D07
  change: changed
  clause: Long stop date
  v3: If completion has not occurred by 31 March 2027, either party may terminate.
  v4: If completion has not occurred by 30 June 2027, either party may terminate.
- id: TS-D08
  change: changed
  clause: Exclusivity
  v3: The promoters shall deal exclusively with the Investor for 45 days from signing.
  v4: The promoters shall deal exclusively with the Investor for 60 days from signing.
- id: TS-D09
  change: changed
  clause: Break fee
  v3: A break fee of ₹15 crore is payable if the promoters withdraw without cause.
  v4: A break fee of ₹20 crore is payable if the promoters withdraw without cause.
- id: TS-D10
  change: changed
  clause: Governing law
  v3: This term sheet is governed by Indian law; disputes are referred to arbitration seated in Mumbai.
  v4: This term sheet is governed by Indian law; disputes are referred to arbitration under the SIAC Rules seated in Singapore.
- id: TS-D11
  change: removed
  clause: Right of first refusal
  v3: The Investor shall have a right of first refusal on any transfer by the promoters.
- id: TS-D12
  change: removed
  clause: Drag-along
  v3: Holders of 75% of the shares may require the other shareholders to sell on the same terms.
- id: TS-D13
  change: added
  clause: Non-compete
  v4: The promoters shall not compete with the Company for 3 years after completion.
- id: TS-D14
  change: added
  clause: Material adverse change
  v4: The Investor may terminate if a material adverse change occurs before completion.
- id: TS-D15
  change: added
  clause: Earn-out
  v4: An earn-out of up to ₹75 crore is payable if FY2026 EBITDA is at least ₹420 crore.
